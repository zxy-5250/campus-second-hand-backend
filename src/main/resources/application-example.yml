server:
  port: 8080
spring:
  application:
    name: secondhand-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
# 文件上传保存目录（相对 backend 项目根目录）
upload:
  dir: ./upload/
# JWT配置
jwt:
  secret: ${JWT_SECRET:myLocalSecret1234567890abcdefghijklmnopqrstuvwxyz}
  expiration: 86400000
